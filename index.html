<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1D3F8F">
<title>ขายคล่อง POS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: nav rail | product wall | receipt-slip cart. Ink navy + marigold "charge" button, Thai banknote colours on cash keys */
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#131A25; --ink-2:#465264; --muted:#6E7A8D; --line:#DCE1E8;
  --accent:#1D3F8F; --accent-ink:#FFFFFF; --accent-soft:#E2E9F8;
  --gold:#F3A31B; --gold-ink:#1C1404; --gold-soft:#FDF0D5;
  --good:#1D7A45; --good-soft:#E1F3E8; --bad:#BC322B; --bad-soft:#FBE6E4; --warn:#8F5B00; --warn-soft:#FBF0D9;
  --slip:#FFFFFF; --shade:rgba(15,20,30,.45);
  --t0:#F4E5D6; --t1:#E0EFD6; --t2:#F8DEE3; --t3:#DAE8F7; --t4:#FBE5CC; --t5:#F5EEC2; --t6:#E7DEF5; --t7:#E2E6EB;
  --font-body:"Anuphan","Noto Sans Thai","Leelawadee UI","Sukhumvit Set",system-ui,sans-serif;
  --font-num:"Chakra Petch","Anuphan",ui-monospace,monospace;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(19,26,37,.06),0 6px 20px rgba(19,26,37,.07);
  --fs-xs:12px; --fs-sm:13.5px; --fs-md:15px; --fs-lg:18px; --fs-xl:24px; --fs-xxl:34px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1218; --surface:#161C25; --surface-2:#1D2430; --ink:#E8ECF2; --ink-2:#B3BCCA; --muted:#8892A3; --line:#2A3341;
    --accent:#8DB0F6; --accent-ink:#0D1830; --accent-soft:#1E2A44;
    --gold:#F5B03A; --gold-ink:#1C1404; --gold-soft:#3A2D12;
    --good:#5CC88B; --good-soft:#15301F; --bad:#F07A72; --bad-soft:#3A1A18; --warn:#E8B44E; --warn-soft:#352812;
    --slip:#1A212C; --shade:rgba(0,0,0,.6);
    --t0:#3A2E24; --t1:#24331F; --t2:#3B2329; --t3:#1F2D3D; --t4:#3D2E1C; --t5:#36321B; --t6:#2D2540; --t7:#262C35;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#161C25; --surface-2:#1D2430; --ink:#E8ECF2; --ink-2:#B3BCCA; --muted:#8892A3; --line:#2A3341;
  --accent:#8DB0F6; --accent-ink:#0D1830; --accent-soft:#1E2A44;
  --gold:#F5B03A; --gold-ink:#1C1404; --gold-soft:#3A2D12;
  --good:#5CC88B; --good-soft:#15301F; --bad:#F07A72; --bad-soft:#3A1A18; --warn:#E8B44E; --warn-soft:#352812;
  --slip:#1A212C; --shade:rgba(0,0,0,.6);
  --t0:#3A2E24; --t1:#24331F; --t2:#3B2329; --t3:#1F2D3D; --t4:#3D2E1C; --t5:#36321B; --t6:#2D2540; --t7:#262C35;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-md);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.hidden{display:none !important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
#app{height:100%;display:grid;grid-template-columns:84px 1fr}
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:14px 8px;gap:4px;z-index:5}
.brand{font-weight:700;font-size:15px;text-align:center;line-height:1.1;margin:2px 0 14px;letter-spacing:-.01em}
.brand b{display:block;color:var(--accent);font-size:19px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-size:var(--fs-xs);font-weight:500;position:relative}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn .dot{position:absolute;top:6px;right:16px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--gold-ink);font:600 11px/18px var(--font-num)}
.nav-spacer{flex:1}
.cloud{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);text-align:center;padding:6px 2px;line-height:1.25}
.cloud i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:block}
.cloud[data-s="on"] i{background:var(--good)}
.cloud[data-s="saving"] i,.cloud[data-s="connecting"] i{background:var(--gold);animation:pulse 1s infinite alternate}
.cloud[data-s="error"] i,.cloud[data-s="slow"] i{background:var(--bad)}
@keyframes pulse{to{opacity:.35}}
main{min-width:0;min-height:0;position:relative}
.view{display:none;height:100%;min-height:0}
.view.on{display:flex}
.page{flex:1;overflow:auto;padding:22px 28px 40px}
.page-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
.page-head h1{font-size:var(--fs-xl);font-weight:700}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.big{min-height:54px;font-size:var(--fs-lg);border-radius:14px}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:var(--fs-sm);border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-2);font-size:18px}
.icon-btn:hover{background:var(--surface-2)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.field small{color:var(--muted);font-size:var(--fs-xs)}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:var(--fs-sm);font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.full{display:flex}.seg.full button{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer}
.switch input{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:var(--fs-sm);font-weight:500;white-space:nowrap;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip b{font-family:var(--font-num)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.cash{background:var(--good-soft);color:var(--good)}
.pill.pp{background:var(--accent-soft);color:var(--accent)}
.pill.other{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.void{background:var(--bad-soft);color:var(--bad)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:var(--fs-md);font-weight:700;margin-bottom:12px}
.card h2 small{font-weight:500;color:var(--muted);font-size:var(--fs-xs);margin-left:6px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .big-emoji{font-size:40px;line-height:1}

/* ---------- sell ---------- */
#v-sell{display:none}
#v-sell.on{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);width:100%}
@media (min-width:900px){#cart-close{display:none}}
.sell-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.sell-top{display:flex;gap:10px;align-items:center;padding:16px 20px 10px}
.search{flex:1;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;border:0;outline:0;background:transparent;min-width:0;height:44px}
.search svg{color:var(--muted)}
.parked-btn{min-height:46px}
.parked-btn b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:var(--gold-ink);font:600 12px var(--font-num);padding:0 6px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.grid{flex:1;overflow:auto;padding:4px 20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));grid-auto-rows:min-content;gap:12px;align-content:start}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:122px;padding:12px 12px 10px;border-radius:var(--r);background:var(--t7);border:1px solid transparent;transition:transform .08s,box-shadow .15s;overflow:hidden}
.tile:hover{box-shadow:var(--shadow)}
.tile:active{transform:scale(.96)}
.tile.t0{background:var(--t0)}.tile.t1{background:var(--t1)}.tile.t2{background:var(--t2)}.tile.t3{background:var(--t3)}.tile.t4{background:var(--t4)}.tile.t5{background:var(--t5)}.tile.t6{background:var(--t6)}.tile.t7{background:var(--t7)}
.tile-emoji{font-size:30px;line-height:1.1;margin-bottom:8px}
.tile-name{font-weight:600;font-size:var(--fs-md);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1 0 auto;padding-bottom:1px}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;margin-top:6px}
.tile-price{font-weight:600;font-size:var(--fs-lg)}
.tile-qty{position:absolute;top:8px;right:8px;min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:var(--ink);color:var(--surface);font:600 14px/28px var(--font-num);text-align:center}
.tile.is-out{opacity:.55}
.tile.is-out::after{content:attr(data-out);position:absolute;top:12px;right:-30px;transform:rotate(35deg);background:var(--bad);color:#fff;font-size:12px;font-weight:700;padding:2px 34px}
.tile-add{border:1.5px dashed var(--line);background:transparent;align-items:center;justify-content:center;color:var(--muted);gap:6px;font-weight:600}
.demo-banner{margin:14px 20px 0;padding:10px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink);display:flex;align-items:center;gap:12px;font-size:var(--fs-sm);line-height:1.4}
.demo-banner p{margin:0;flex:1;min-width:0}
.demo-banner .btn{flex:none}
.warn-banner{margin:14px 20px 0;padding:10px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:var(--fs-sm)}

/* cart = receipt slip */
.cart{background:var(--slip);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
.cart-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px dashed var(--line)}
.cart-head .top{display:flex;align-items:center;gap:8px}
.cart-head h2{font-size:var(--fs-lg);font-weight:700;flex:1}
.cart-head h2 small{font:500 var(--fs-xs) var(--font-num);color:var(--muted);margin-left:6px}
.cart-items{flex:1;overflow:auto;padding:6px 8px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 8px;border-radius:10px;cursor:pointer;width:100%;text-align:left}
.line:hover{background:var(--surface-2)}
.line-name{font-weight:600;line-height:1.3}
.line-opts{grid-column:1;font-size:var(--fs-xs);color:var(--muted);line-height:1.35}
.line-amt{font-family:var(--font-num);font-weight:600;text-align:right}
.line-ctl{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.qty button{width:36px;height:34px;font-size:18px;font-weight:600;color:var(--ink-2)}
.qty button:hover{background:var(--surface-2)}
.qty span{min-width:30px;text-align:center;font:600 15px var(--font-num)}
.line-unit{font-size:var(--fs-xs);color:var(--muted);font-family:var(--font-num)}
.cart-sum{padding:12px 16px 16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.sum-row{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-sm);color:var(--ink-2)}
.sum-row .num{color:var(--ink)}
.sum-row button{color:var(--accent);font-weight:600;font-size:var(--fs-sm)}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 8px}
.grand span{font-weight:600}
.grand strong{font-size:var(--fs-xxl);font-weight:700;line-height:1}
.cart-actions{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
.cart-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:24px}
.cart-empty svg{width:44px;height:44px;stroke-width:1.4}
.cartbar{display:none}

/* ---------- sheets ---------- */
#sheets{position:fixed;inset:0;pointer-events:none;z-index:50}
.sheet-wrap{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:var(--shade);opacity:0;transition:opacity .18s}
.sheet{position:relative;width:min(560px,94vw);max-height:90%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:translateY(16px) scale(.98);opacity:0;transition:transform .2s,opacity .2s}
.sheet.wide{width:min(760px,96vw)}
.sheet-wrap.in .sheet-backdrop{opacity:1}
.sheet-wrap.in .sheet{transform:none;opacity:1}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 20px}
.sheet-head h2{flex:1;font-size:var(--fs-lg);font-weight:700}
.sheet-body{overflow:auto;padding:4px 20px 18px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{padding:12px 20px 18px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.sheet-foot .btn{flex:1}
.opt-group{display:flex;flex-direction:column;gap:8px}
.opt-group h3{font-size:var(--fs-sm);font-weight:700;display:flex;gap:8px;align-items:center}
.opt-group h3 small{font-weight:500;color:var(--muted)}
.opt-chips{display:flex;flex-wrap:wrap;gap:8px}
.opt-chip{min-height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.opt-chip small{color:var(--muted);font-family:var(--font-num)}
.opt-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt-chip.on small{color:var(--accent)}
.big-qty{display:flex;align-items:center;justify-content:center;gap:18px}
.big-qty button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);font-size:24px;font-weight:600;background:var(--surface-2)}
.big-qty span{font:700 30px var(--font-num);min-width:50px;text-align:center}

/* payment */
.pay-total{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px}
.pay-total span{color:var(--muted);font-size:var(--fs-sm)}
.pay-total strong{font:700 44px/1.05 var(--font-num)}
.cash-display{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cash-display div{background:var(--surface-2);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column}
.cash-display small{color:var(--muted);font-size:var(--fs-xs)}
.cash-display b{font:700 26px/1.2 var(--font-num)}
.cash-display .chg.ok{background:var(--good-soft)}.cash-display .chg.ok b{color:var(--good)}
.cash-display .chg.short{background:var(--bad-soft)}.cash-display .chg.short b{color:var(--bad);font-size:20px}
.notes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.note{min-height:48px;border-radius:12px;font:700 17px var(--font-num);color:#fff;position:relative;overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.note::before{content:"฿";font-size:12px;opacity:.8;margin-right:1px}
.note.exact{background:var(--ink);color:var(--surface);font-family:var(--font-body);font-size:15px}
.note.exact::before{content:none}
.n20{background:#2C8352}.n50{background:#2E68AD}.n100{background:#BF3B34}.n500{background:#73479F}.n1000{background:#86664C}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keypad button{min-height:52px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font:600 22px var(--font-num)}
.keypad button:active{background:var(--line)}
.keypad .k-clear{font:600 15px var(--font-body);color:var(--bad)}
.qr-card{align-self:center;width:min(300px,100%);border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff;color:#14223E;text-align:center}
.qr-card header{background:#163A70;color:#fff;padding:10px;font-weight:700;letter-spacing:.02em}
.qr-card header small{display:block;font-weight:400;opacity:.85;font-size:11.5px}
.qr-card svg{display:block;width:78%;margin:16px auto 8px}
.qr-card .amt{font:700 28px var(--font-num);color:#14223E}
.qr-card .who{font-size:13px;color:#4A5875;padding:0 12px 14px}
.method-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.method-list button{min-height:56px;border-radius:14px;border:1.5px solid var(--line);font-weight:600;background:var(--surface)}
.method-list button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.success{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:4px}
.success .check{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.success .check svg{width:30px;height:30px;stroke-width:2.6}
.success .chg-label{color:var(--muted);font-size:var(--fs-sm);margin-top:4px}
.success .chg-amt{font:700 54px/1 var(--font-num);color:var(--good)}

/* receipt (always paper-coloured) */
.receipt-wrap{background:var(--surface-2);border-radius:14px;padding:18px 12px;display:flex;justify-content:center}
.receipt{width:300px;max-width:100%;background:#FFFEFA;color:#1A1A1A;padding:18px 16px 22px;font-size:13px;line-height:1.45;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.12);
  -webkit-mask:radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) bottom/12px 100% repeat-x;mask:radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) bottom/12px 100% repeat-x;padding-bottom:26px}
.r-center{text-align:center}
.r-shop{font-weight:700;font-size:16px}
.r-small{font-size:11.5px;color:#444}
.r-title{text-align:center;font-weight:600;margin:8px 0 4px;font-size:12.5px}
.r-meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#333}
.r-hr{border:0;border-top:1px dashed #999;margin:8px 0}
.r-row{display:flex;justify-content:space-between;gap:10px}
.r-row span:last-child{font-family:var(--font-num);white-space:nowrap}
.r-sub{font-size:11.5px;color:#555;padding-left:10px}
.r-total{font-weight:700;font-size:16px}
.r-foot{text-align:center;margin-top:10px;font-size:12px}
.r-void{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid #C0352E;color:#C0352E;font-weight:800;font-size:24px;padding:2px 14px;border-radius:6px;opacity:.85;background:rgba(255,254,250,.6)}
#print-area{display:none}

/* ---------- bills ---------- */
.daynav{display:flex;align-items:center;gap:6px}
.daynav .inp{width:auto;min-height:42px}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.stat small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.stat b{font:700 22px/1.3 var(--font-num)}
.bill-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bill-row{display:grid;grid-template-columns:70px 1fr auto auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.bill-row:last-child{border-bottom:0}
.bill-row:hover{background:var(--surface-2)}
.bill-row.void .bill-total{text-decoration:line-through;color:var(--muted)}
.bill-no{font-weight:600;color:var(--ink-2)}
.bill-main{min-width:0}
.bill-main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-main small{color:var(--muted);font-size:var(--fs-xs)}
.bill-total{font:700 17px var(--font-num);text-align:right;min-width:80px}

/* ---------- report ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi small{color:var(--muted);font-size:var(--fs-sm)}
.kpi b{display:block;font:700 28px/1.25 var(--font-num);margin-top:2px}
.kpi em{font-style:normal;font-size:var(--fs-xs);color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero small,.kpi.hero em{color:inherit;opacity:.8}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.chart{position:relative}
.chart-plot{position:relative;height:190px;margin-left:46px;border-bottom:1px solid var(--line)}
.chart-grid{position:absolute;left:-46px;right:0;border-top:1px dashed var(--line);font:500 11px var(--font-num);color:var(--muted)}
.chart-grid span{position:absolute;left:0;top:-8px;width:40px;text-align:right}
.chart-bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.chart-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;cursor:default}
.chart-col i{display:block;width:72%;max-width:30px;min-height:0;background:var(--accent);border-radius:4px 4px 0 0;transition:opacity .15s}
.chart-col.now i{background:var(--gold)}
.chart-col:hover i{opacity:.75}
.chart-x{display:flex;gap:2px;margin-left:46px;margin-top:6px}
.chart-x span{flex:1;text-align:center;font:500 11px var(--font-num);color:var(--muted);white-space:nowrap;overflow:visible}
.chart-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 10px;border-radius:8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);z-index:3;line-height:1.35}
.chart-tip b{font-family:var(--font-num)}
.chart-legend{display:flex;gap:14px;font-size:var(--fs-xs);color:var(--muted);margin-top:10px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.barlist{display:flex;flex-direction:column;gap:12px}
.barlist .bl-top{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-sm)}
.barlist .bl-top b{font-family:var(--font-num)}
.barlist .bl-track{height:8px;border-radius:4px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.barlist .bl-track i{display:block;height:100%;background:var(--accent);border-radius:4px}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:var(--fs-xs);padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-family:var(--font-num);white-space:nowrap}
.tbl .rank{color:var(--muted);font-family:var(--font-num);width:28px}
.drawer{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.drawer div{display:flex;flex-direction:column}
.drawer small{color:var(--muted);font-size:var(--fs-xs)}
.drawer b{font:700 20px var(--font-num)}
.drawer .eq b{color:var(--good);font-size:24px}

/* ---------- items & settings ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item-row{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item-row:last-child{border-bottom:0}
.item-row:hover{background:var(--surface-2)}
.item-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--t7)}
.item-ico.t0{background:var(--t0)}.item-ico.t1{background:var(--t1)}.item-ico.t2{background:var(--t2)}.item-ico.t3{background:var(--t3)}.item-ico.t4{background:var(--t4)}.item-ico.t5{background:var(--t5)}.item-ico.t6{background:var(--t6)}
.item-main b{display:block;font-weight:600}
.item-main small{color:var(--muted);font-size:var(--fs-xs)}
.item-price{font:600 16px var(--font-num)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emoji-grid button{height:44px;border-radius:10px;font-size:24px;border:1.5px solid transparent;background:var(--surface-2)}
.emoji-grid button.on{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line)}
.swatches button.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface) inset}
.choice-row{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center}
.cat-row{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:8px 10px 8px 16px;border-bottom:1px solid var(--line)}
.cat-row:last-child{border-bottom:0}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.settings .card{display:flex;flex-direction:column;gap:14px}
.settings .card h2{margin-bottom:0}
.note-box{font-size:var(--fs-xs);color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;line-height:1.5}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-size:var(--fs-sm);font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
#toast.in{opacity:1;transform:translate(-50%,0)}

/* ---------- phone ---------- */
@media (max-width:899px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  main{grid-row:1}
  .nav{grid-row:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom));gap:2px}
  .brand,.nav-spacer{display:none}
  .nav-btn{flex:1;padding:7px 2px;font-size:11px}
  .nav-btn .dot{right:calc(50% - 22px);top:2px}
  .cloud{display:none}
  #v-sell.on{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
  .sell-top{padding:12px 14px 8px}
  .cats{padding:2px 14px 10px}
  .grid{padding:2px 14px 96px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .tile{min-height:112px;padding:10px 10px 8px}
  .tile-emoji{font-size:26px;margin-bottom:6px}
  .tile-name{font-size:14px}
  .tile-price{font-size:16px}
  .demo-banner,.warn-banner{margin:8px 14px 0;padding:8px 12px;font-size:12.5px}
  .cart{position:fixed;inset:0;z-index:40;border-left:0;transform:translateY(100%);transition:transform .25s;visibility:hidden}
  .cart.open{transform:none;visibility:visible}
  .cartbar{display:flex;position:absolute;left:12px;right:12px;bottom:12px;z-index:6;border-radius:16px;background:var(--ink);color:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden}
  .cartbar.hidden{display:none}
  .cartbar button{min-height:58px;display:flex;align-items:center;gap:10px;padding:0 16px}
  .cartbar .cb-view{flex:1;text-align:left}
  .cartbar .cb-count{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:14px;background:var(--surface);color:var(--ink);font:700 14px var(--font-num);padding:0 7px}
  .cartbar .cb-total{font:700 20px var(--font-num)}
  .cartbar .cb-pay{background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:16px}
  .cartbar.bump{animation:bump .25s}
  .page{padding:16px 14px 32px}
  .kpis,.stat-strip{grid-template-columns:1fr 1fr}
  .cols,.settings,.grid2{grid-template-columns:1fr}
  .bill-row{grid-template-columns:52px 1fr auto;gap:10px;padding:12px}
  .bill-row .pill{display:none}
  .sheet-wrap{align-items:flex-end}
  .sheet,.sheet.wide{width:100%;max-height:94%;border-radius:20px 20px 0 0;transform:translateY(40px)}
  .sheet-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .notes{grid-template-columns:repeat(3,1fr)}
  .pay-total strong{font-size:38px}
  .drawer{grid-template-columns:1fr 1fr 1fr}
  .drawer b{font-size:16px}.drawer .eq b{font-size:19px}
}
@keyframes bump{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

@media print{
  body{overflow:visible;background:#fff}
  body>*:not(#print-area){display:none !important}
  #print-area{display:block}
  #print-area .receipt{width:100%;box-shadow:none;-webkit-mask:none;mask:none;padding:0 2mm 4mm;font-size:12px}
  #print-area .r-void{background:none}
}

/* ---------- v1.1: photos, PIN, lock, expenses ---------- */
.tile-img{display:block;width:calc(100% + 24px);max-width:none;margin:-12px -12px 8px;height:86px;object-fit:cover;border-radius:var(--r) var(--r) 0 0}
.item-ico{overflow:hidden}
.item-ico img{width:100%;height:100%;object-fit:cover;display:block}
.photo-prev{width:72px;height:48px;border-radius:10px;font-size:24px}
.r-b{font-weight:700}
.r-smallrow{font-size:11.5px;color:#333}
.lockscreen{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:72px 16px}
.lockscreen p{margin:0 0 6px;max-width:34ch}
.lock-ico{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.lock-ico svg{width:30px;height:30px}
.sheet.pin-sheet{width:min(400px,94vw)}
.pin{display:flex;flex-direction:column;align-items:center;gap:12px}
.pin-title{margin:0;font-weight:600}
.pin-dots{display:flex;gap:16px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-2)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pin-dots.bad{animation:shake .3s}
.pin-dots.bad i{border-color:var(--bad)}
.pin-msg{margin:0;min-height:20px;color:var(--bad);font-size:13px}
.pinpad{width:min(300px,100%);grid-template-columns:repeat(3,1fr)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.exp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line)}
.exp-row:last-child{border-bottom:0}
.exp-row:hover{background:var(--surface-2)}
.exp-row small{display:block;color:var(--muted);font-size:12px}
.exp-row .num{font-weight:600;color:var(--bad);white-space:nowrap}
.warn-banner.row{display:flex;gap:10px;align-items:center}
@media (max-width:899px){.tile-img{width:calc(100% + 20px);margin:-10px -10px 6px;height:72px}}

</style>
</head>
<body>
<div id="app">
  <nav class="nav" aria-label="เมนูหลัก">
    <div class="brand">ขาย<b>คล่อง</b></div>
    <a class="nav-btn" href="#sell" data-view="sell"><svg class="i" viewBox="0 0 24 24"><path d="M3 8h18l-1.6 10.2a2 2 0 0 1-2 1.8H6.6a2 2 0 0 1-2-1.8L3 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg><span>ขาย</span></a>
    <a class="nav-btn" href="#bills" data-view="bills"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>บิล</span></a>
    <a class="nav-btn" href="#report" data-view="report"><svg class="i" viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 20v-7M11 20V6M16 20v-9M21 20V9"/></svg><span>สรุปยอด</span></a>
    <a class="nav-btn" href="#items" data-view="items"><svg class="i" viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/></svg><span>สินค้า</span></a>
    <a class="nav-btn" href="#shop" data-view="shop"><svg class="i" viewBox="0 0 24 24"><path d="M4 10v10h16V10"/><path d="M3 10l2-6h14l2 6a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M10 20v-5h4v5"/></svg><span>ตั้งค่า</span></a>
    <div class="nav-spacer"></div>
    <div class="cloud" id="cloud" data-s="off" role="status"><i></i><span>บันทึกในเครื่อง</span></div>
  </nav>
  <main>
    <!-- SELL -->
    <section class="view" id="v-sell" aria-label="หน้าขาย">
      <div class="sell-main">
        <div id="banners"></div>
        <div class="sell-top">
          <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="ค้นหาสินค้า หรือสแกนบาร์โค้ด" autocomplete="off" aria-label="ค้นหาสินค้า"></label>
          <button class="btn parked-btn" data-act="parked-list" id="parked-btn">บิลที่พักไว้ <b id="parked-n">0</b></button>
        </div>
        <div class="cats" id="cats" role="tablist" aria-label="หมวดสินค้า"></div>
        <div class="grid" id="grid"></div>
      </div>
      <aside class="cart" id="cart" aria-label="บิลปัจจุบัน">
        <div class="cart-head">
          <div class="top">
            <h2>บิลปัจจุบัน <small id="cart-no"></small></h2>
            <button class="icon-btn" data-act="cart-close" id="cart-close" aria-label="ย่อบิล">✕</button>
          </div>
          <div class="seg full" id="otype" role="group" aria-label="ประเภทออเดอร์">
            <button data-act="otype" data-v="dine">ทานที่ร้าน</button><button data-act="otype" data-v="take">กลับบ้าน</button><button data-act="otype" data-v="deliv">เดลิเวอรี่</button>
          </div>
          <input class="inp" id="cart-label" placeholder="โต๊ะ / ชื่อลูกค้า (ไม่ใส่ก็ได้)" autocomplete="off" aria-label="โต๊ะหรือชื่อลูกค้า">
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-sum" id="cart-sum"></div>
      </aside>
      <div class="cartbar hidden" id="cartbar">
        <button class="cb-view" data-act="cart-open"><span class="cb-count" id="cb-count">0</span><span>ดูบิล</span><span class="cb-total" id="cb-total">฿0</span></button>
        <button class="cb-pay" data-act="pay">คิดเงิน ›</button>
      </div>
    </section>

    <!-- BILLS -->
    <section class="view" id="v-bills" aria-label="ประวัติบิล">
      <div class="page"><div class="page-in">
        <div class="page-head">
          <h1>ประวัติบิล</h1>
          <div class="daynav">
            <button class="icon-btn" data-act="bday" data-d="-1" aria-label="วันก่อนหน้า">‹</button>
            <input class="inp" type="date" id="bdate" aria-label="เลือกวันที่">
            <button class="icon-btn" data-act="bday" data-d="1" aria-label="วันถัดไป">›</button>
            <button class="btn sm" data-act="bday" data-d="0">วันนี้</button>
          </div>
        </div>
        <div class="stat-strip" id="bstats"></div>
        <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="bq" type="search" placeholder="ค้นหาเลขบิล ชื่อสินค้า หรือโต๊ะ" autocomplete="off" aria-label="ค้นหาบิล"></label>
        <div id="blist"></div>
      </div></div>
    </section>

    <!-- REPORT -->
    <section class="view" id="v-report" aria-label="สรุปยอดขาย">
      <div class="page"><div class="page-in" id="report"></div></div>
    </section>

    <!-- ITEMS -->
    <section class="view" id="v-items" aria-label="จัดการสินค้า">
      <div class="page"><div class="page-in" id="items"></div></div>
    </section>

    <!-- SHOP SETTINGS -->
    <section class="view" id="v-shop" aria-label="ตั้งค่าร้าน">
      <div class="page"><div class="page-in" id="shop"></div></div>
    </section>
  </main>
</div>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>
<input type="file" id="file-in" accept=".json,application/json" class="hidden">

<script>
(function(){
'use strict';
/* ===================== helpers ===================== */
const VERSION = '1.1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = (n = 6) => Array.from({length: n}, () => 'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 32)]).join('');
const uid = p => (p || '') + Date.now().toString(36) + rid(4);
const pad = (n, w = 2) => String(n).padStart(w, '0');

/* ===================== licence (ECDSA P-256 signed codes) ===================== */
const b64uEnc = bytes => { let s = ''; bytes.forEach(b => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const b64uDec = str => { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const bin = atob(str); return Uint8Array.from(bin, c => c.charCodeAt(0)); };
const normName = s => String(s || '').replace(/\s+/g, ' ').trim();
function cleanCode(code) {
  let c = String(code || '').trim();
  const k = c.match(/[?&#]key=([^&\s]+)/); if (k) c = decodeURIComponent(k[1]);
  return c.replace(/\s+/g, '');
}
async function verifyCode(code) {
  try {
    if (!PUBKEY || !(window.crypto && crypto.subtle)) return null;
    const m = cleanCode(code).match(/^([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/); if (!m) return null;
    const key = await crypto.subtle.importKey('jwk', PUBKEY, {name: 'ECDSA', namedCurve: 'P-256'}, false, ['verify']);
    const ok = await crypto.subtle.verify({name: 'ECDSA', hash: 'SHA-256'}, key, b64uDec(m[2]), new TextEncoder().encode(m[1]));
    if (!ok) return null;
    return JSON.parse(new TextDecoder().decode(b64uDec(m[1])));
  } catch (e) { return null; }
}

/* ===================== pure business logic ===================== */
function calcTotals(items, discount, vatMode, vatRate) {
  const rate = vatRate || 7;
  const subtotal = items.reduce((s, i) => s + i.unit * i.qty, 0);
  const count = items.reduce((s, i) => s + i.qty, 0);
  let disc = 0;
  if (discount && discount.value > 0) {
    disc = discount.type === 'pct' ? Math.round(subtotal * Math.min(discount.value, 100) / 100) : Math.min(Math.round(discount.value), subtotal);
  }
  const afterDisc = subtotal - disc;
  let vat = 0, total = afterDisc, beforeVat = afterDisc;
  if (vatMode === 'incl') { vat = Math.round(afterDisc * rate / (100 + rate)); beforeVat = afterDisc - vat; }
  else if (vatMode === 'excl') { vat = Math.round(afterDisc * rate / 100); total = afterDisc + vat; }
  return {subtotal, count, disc, afterDisc, vat, beforeVat, total};
}

/* PromptPay (Thai QR, EMVCo merchant-presented) */
function crc16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) { crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1); crc &= 0xFFFF; }
  }
  return crc;
}
function ppValid(id) { const t = String(id || '').replace(/\D/g, ''); return (t.length === 10 && t[0] === '0') || t.length === 13 || t.length === 15; }
function ppPayload(target, amountSat) {
  const t = String(target).replace(/\D/g, '');
  const type = t.length >= 15 ? '03' : t.length >= 13 ? '02' : '01';
  const acct = t.length >= 13 ? t : ('0000000000000' + t.replace(/^0/, '66')).slice(-13);
  const f = (id, v) => id + pad(v.length) + v;
  let s = f('00', '01') + f('01', amountSat ? '12' : '11') + f('29', f('00', 'A000000677010111') + f(type, acct)) + f('58', 'TH') + f('53', '764') + (amountSat ? f('54', (amountSat / 100).toFixed(2)) : '') + '6304';
  return s + crc16(s).toString(16).toUpperCase().padStart(4, '0');
}
function ppMask(id) { const t = String(id || '').replace(/\D/g, ''); if (t.length === 10) return 'xxx-xxx-' + t.slice(6); if (t.length >= 13) return 'x-xxxx-xxxxx-' + t.slice(-3, -1) + '-' + t.slice(-1); return t; }
function qrSvg(text) {
  if (typeof window.qrcode !== 'function') return '';
  const q = window.qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
  return '<svg viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) + '" shape-rendering="crispEdges" role="img" aria-label="QR พร้อมเพย์"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) + '" fill="#fff"/><path d="' + d + '" fill="#0B1730"/></svg>';
}

/* ===================== local storage (IndexedDB → localStorage → memory) ===================== */
const Store = (() => {
  let mode = 'mem', idb = null; const mem = new Map(); const LS = 'khaiklong:';
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const os = m => idb.transaction('kv', m).objectStore('kv');
  async function init() {
    try {
      idb = await new Promise((res, rej) => {
        const r = indexedDB.open('khaiklong-pos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('idb timeout')), 2500);
      });
      mode = 'idb'; return;
    } catch (e) { idb = null; }
    try { localStorage.setItem(LS + 't', '1'); localStorage.removeItem(LS + 't'); mode = 'ls'; } catch (e) { mode = 'mem'; }
  }
  async function get(k) {
    try {
      if (mode === 'idb') return await req(os('readonly').get(k));
      if (mode === 'ls') { const v = localStorage.getItem(LS + k); return v == null ? undefined : JSON.parse(v); }
    } catch (e) { console.warn('store get', e); }
    return mem.get(k);
  }
  async function set(k, v) {
    try {
      if (mode === 'idb') { await req(os('readwrite').put(clone(v), k)); return true; }
      if (mode === 'ls') { localStorage.setItem(LS + k, JSON.stringify(v)); return true; }
    } catch (e) { console.warn('store set', e); storageTrouble(); }
    mem.set(k, clone(v)); return false;
  }
  async function del(k) {
    try { if (mode === 'idb') { await req(os('readwrite').delete(k)); return; } if (mode === 'ls') { localStorage.removeItem(LS + k); return; } } catch (e) {}
    mem.delete(k);
  }
  async function keys() {
    try {
      if (mode === 'idb') return (await req(os('readonly').getAllKeys())).map(String);
      if (mode === 'ls') return Object.keys(localStorage).filter(k => k.startsWith(LS)).map(k => k.slice(LS.length));
    } catch (e) {}
    return Array.from(mem.keys());
  }
  return {init, get, set, del, keys, get mode() { return mode; }};
})();
let storageWarned = false;
function storageTrouble() { if (!storageWarned) { storageWarned = true; toast('บันทึกข้อมูลในเครื่องไม่สำเร็จ ควรกดสำรองข้อมูลไว้'); } }

/* ===================== cloud sync (Claude artifact db, per-person private) ===================== */
const Cloud = {
  db: null, uid: null, status: 'off', seeded: false, pending: new Map(), busy: new Set(), timer: 0, retryMs: 700,
  col() { return this.db.collection('data/users/' + this.uid); },
  queue(id, data) {
    if (!this.db) return;
    if (!this.seeded) { this.seeded = true; pushAll(); return; }
    this.pending.set(id, data === null ? null : clone(data));
    this.schedule(this.retryMs);
    setCloud('saving');
  },
  schedule(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms); },
  async flush() {
    let failed = false;
    for (const [id, data] of Array.from(this.pending)) {
      if (!this.db) return;
      if (this.busy.has(id)) continue;
      this.pending.delete(id); this.busy.add(id);
      try { await this.write(id, data); }
      catch (e) {
        failed = true; const c = e && e.code;
        if (c === 'quota_exceeded') { toast('พื้นที่บันทึกออนไลน์เต็ม กรุณาสำรองข้อมูลแล้วล้างบิลเก่า'); }
        else if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { this.db = null; this.pending.clear(); setCloud('off'); return; }
        else if (!this.pending.has(id)) this.pending.set(id, data);
      } finally { this.busy.delete(id); }
    }
    if (failed) { setCloud('error'); this.retryMs = Math.min(this.retryMs * 3, 30000); this.schedule(this.retryMs); return; }
    this.retryMs = 700;
    if (this.pending.size) this.schedule(700); else setCloud('on');
  },
  async write(id, data) {
    const ref = this.col().doc(id);
    const go = () => data === null ? ref.delete() : ref.set(data);
    try { await go(); }
    catch (e) { if (e && e.code === 'unavailable') { await sleep(600 + Math.random() * 900); await go(); } else throw e; }
  },
  async wipe() {
    if (!this.db) return;
    this.pending.clear();
    try {
      const snap = await this.col().get();
      for (const d of snap.docs) { try { await this.col().doc(d.id).delete(); } catch (e) {} }
    } catch (e) { console.warn('wipe', e); }
    this.seeded = false;
  }
};

async function connectCloud() {
  if (!CL) { setCloud('off'); return; }
  setCloud('connecting');
  const slow = setTimeout(() => { if (Cloud.status === 'connecting') setCloud('slow'); }, 10000);
  try {
    const [db, user] = await Promise.all([CL.use('db'), CL.use('user')]);
    if (!db || !user) { clearTimeout(slow); setCloud('off'); return; }
    const id = await user.id();
    if (!id) { clearTimeout(slow); setCloud('off'); return; }
    Cloud.db = db; Cloud.uid = id;
    const snap = await db.collection('data/users/' + id).get();
    clearTimeout(slow);
    const changed = await mergeCloud(snap.docs);
    if (Cloud.status !== 'saving') setCloud('on');
    if (changed) { renderAll(); toast('โหลดข้อมูลร้านจากบัญชีออนไลน์แล้ว'); }

async function mergeCloud(docs) {
  const byId = {};
  docs.forEach(d => { if (d.exists) byId[d.id] = clone(d.data()); });
  const ids = Object.keys(byId);
  if (!ids.length) { Cloud.seeded = false; if (!state.demo) pushAll(); return false; }
  Cloud.seeded = true;
  let changed = false, droppedDemo = false;
  const cc = byId.config;
  if (cc && cc.settings) {
    const takeCloud = (state.demo && !cc.demo) || (cc.updatedAt || 0) > (state.updatedAt || 0);
    if (takeCloud) { if (state.demo && !cc.demo) droppedDemo = true; applyConfig(cc); changed = true; await Store.set('config', configDoc()); }
    else if ((state.updatedAt || 0) > (cc.updatedAt || 0)) Cloud.queue('config', configDoc());
  }
  const cp = byId.parked;
  if (cp && Array.isArray(cp.list) && ((cp.updatedAt || 0) > (state.parkedAt || 0) || droppedDemo)) { state.parked = cp.list; state.parkedAt = cp.updatedAt || 0; changed = true; await Store.set('parked', cp); }
  if (droppedDemo) { state.bills = state.bills.filter(b => !b.demo); state.expenses = state.expenses.filter(b => !b.demo); }
  for (const kind of ['bills', 'expenses']) {
    const pre = COLS[kind].cloud;
    const cloudRows = new Map();
    ids.filter(i => i[0] === pre && /^[be]\d{8}_/.test(i)).forEach(i => (byId[i].bills || []).forEach(b => { const cur = cloudRows.get(b.id); if (!cur || (b.updatedAt || 0) > (cur.updatedAt || 0)) cloudRows.set(b.id, b); }));
    const local = new Map(state[kind].map(b => [b.id, b]));
    const touched = new Set(), dirty = new Set();
    cloudRows.forEach((b, id) => { const l = local.get(id); if (!l || (b.updatedAt || 0) > (l.updatedAt || 0)) { local.set(id, b); touched.add(b.day); changed = true; } });
    local.forEach((b, id) => { const c = cloudRows.get(id); if (b.wdev === DEV && (!c || (b.updatedAt || 0) > (c.updatedAt || 0))) dirty.add(b.day); });
    state[kind] = Array.from(local.values()).sort((a, b) => a.ts - b.ts);
    if (!droppedDemo) for (const d of touched) await saveDayLocal(d, kind);
    dirty.forEach(d => queueDayShards(d, kind));
  }
  ids.filter(i => i.startsWith('i_')).forEach(i => { const d = byId[i]; if (d && d.pid && typeof d.data === 'string' && !state.images[d.pid]) { state.images[d.pid] = d.data; Store.set('img:' + d.pid, d.data); changed = true; } });
  Object.keys(state.images).forEach(pid => { if (!byId['i_' + pid]) Cloud.queue('i_' + pid, {pid, data: state.images[pid]}); });
  if (droppedDemo) await saveEverythingLocal();
  return changed;
}

    onClose: o.onClose, onKey: o.onKey,
    setBody(h) { this.body.innerHTML = h; }, setFoot(h) { this.foot.innerHTML = h || ''; this.foot.classList.toggle('hidden', !h); },
    close() { const i = sheets.indexOf(this); if (i >= 0) sheets.splice(i, 1); wrap.classList.remove('in'); setTimeout(() => wrap.remove(), 200); if (this.onClose) this.onClose(); }
  };
  api.setBody(o.html || ''); api.setFoot(o.foot);
  sheets.push(api);
  requestAnimationFrame(() => wrap.classList.add('in'));
  if (o.mount) o.mount(api);
  setTimeout(() => { const f = api.el.querySelector('[autofocus]'); if (f && matchMedia('(min-width:900px)').matches) f.focus(); }, 60);
  return api;
}

function addToCart(p, choiceIds, qty, note) {
  let unit = p.price; const names = [];
  (p.options || []).forEach(gid => { const g = og(gid); if (!g) return; g.choices.forEach(c => { if (choiceIds.includes(gid + ':' + c.id)) { unit += c.price; names.push(c.name); } }); });
  const key = p.id + '|' + choiceIds.slice().sort().join(',') + '|' + (note || '');
  const ex = cart.items.find(i => i.key === key);
  if (ex) ex.qty += qty;
  else cart.items.push({key, pid: p.id, name: p.name, unit, qty, optsText: names.join(', '), choiceIds, note: note || '', cost: p.cost || 0});
  if (p.track) { const used = cart.items.filter(i => i.pid === p.id).reduce((s, i) => s + i.qty, 0); if (used > p.stock) toast(p.name + ' ในสต็อกเหลือ ' + p.stock + ' ชิ้น'); }
  cartChanged(true);
}
function tapProduct(id) {
  const p = prod(id); if (!p) return;
  if (p.soldOut) { toast(p.name + ' ปิดขายอยู่ เปิดได้ที่หน้า สินค้า'); return; }
  if (p.track && p.stock <= 0) { toast(p.name + ' หมดสต็อก เติมสต็อกได้ที่หน้า สินค้า'); return; }
  const groups = (p.options || []).map(og).filter(Boolean);
  if (!groups.length) { addToCart(p, [], 1, ''); return; }
  openOptions(p, groups);
}
function openOptions(p, groups, editIdx) {
  const editing = editIdx != null ? cart.items[editIdx] : null;
  let sel = editing ? editing.choiceIds.slice() : [];
  if (!editing) groups.forEach(g => { if (g.required && g.choices[0]) sel.push(g.id + ':' + g.choices[0].id); });
  let qty = editing ? editing.qty : 1; let note = editing ? editing.note : '';
  const unit = () => p.price + groups.reduce((s, g) => s + g.choices.filter(c => sel.includes(g.id + ':' + c.id)).reduce((a, c) => a + c.price, 0), 0);
  const draw = api => {
    api.setBody(groups.map(g => '<div class="opt-group"><h3>' + esc(g.name) + ' <small>' + (g.multi ? 'เลือกได้หลายอย่าง' : g.required ? 'เลือก 1 อย่าง' : 'ไม่บังคับ') + '</small></h3><div class="opt-chips">' +
      g.choices.map(c => { const k = g.id + ':' + c.id; return '<button class="opt-chip ' + (sel.includes(k) ? 'on' : '') + '" data-k="' + k + '" data-g="' + g.id + '" aria-pressed="' + sel.includes(k) + '">' + esc(c.name) + (c.price ? ' <small>+' + money(c.price) + '</small>' : '') + '</button>'; }).join('') + '</div></div>').join('') +
      '<label class="field"><span>หมายเหตุถึงครัว/บาร์</span><input class="inp" id="opt-note" value="' + esc(note) + '" placeholder="เช่น ไม่ใส่น้ำแข็ง" autocomplete="off"></label>' +
      '<div class="big-qty"><button data-q="-1" aria-label="ลดจำนวน">−</button><span>' + qty + '</span><button data-q="1" aria-label="เพิ่มจำนวน">+</button></div>');
    api.setFoot('<button class="btn gold big block" data-x="ok">' + (editing ? 'บันทึก' : 'เพิ่มลงบิล') + ' · ' + B(unit() * qty) + '</button>');
  };
  openSheet({title: (p.emoji || '') + ' ' + p.name + ' · ' + B(p.price), mount: api => {
    draw(api);
    api.el.addEventListener('click', e => {
      const chip = e.target.closest('.opt-chip');
      if (chip) {
        const g = og(chip.dataset.g), k = chip.dataset.k;
        if (g.multi) sel = sel.includes(k) ? sel.filter(x => x !== k) : sel.concat(k);
        else { const had = sel.includes(k); sel = sel.filter(x => !x.startsWith(g.id + ':')); if (!had || g.required) sel.push(k); }
        note = $('#opt-note', api.el).value; draw(api); return;

        note = $('#opt-note', api.el).value.trim();
        if (editing) cart.items.splice(editIdx, 1);
        addToCart(p, sel, qty, note); api.close();
      }
    });
  }});
}

    const svg = qrSvg(ppPayload(s.ppId, t.total));
    return '<div class="qr-card"><header>QR พร้อมเพย์<small>สแกนจ่ายด้วยแอปธนาคารได้ทุกธนาคาร</small></header>' + (svg || '<p style="padding:20px">โหลดตัวสร้าง QR ไม่ได้ (ต้องต่ออินเทอร์เน็ต)<br>ให้ลูกค้าโอนเข้าพร้อมเพย์ ' + esc(s.ppId) + '</p>') +
      '<div class="amt">' + B(t.total) + '</div><div class="who">' + esc(s.ppName || s.shopName) + '<br>พร้อมเพย์ ' + esc(ppMask(s.ppId)) + '</div></div><p class="muted" style="margin:0;font-size:13px;text-align:center">ดูยอดเงินเข้าในแอปธนาคารของร้านก่อนกดยืนยัน</p>';
  };
  const paneOther = () => '<div class="method-list">' + ['โอนเข้าบัญชี', 'บัตรเครดิต/เดบิต', 'แอปเดลิเวอรี่', 'อื่นๆ'].map(m => '<button class="' + (otherSub === m ? 'on' : '') + '" data-sub="' + m + '">' + m + '</button>').join('') + '</div>';
  const footFor = () => {
    if (method === 'cash') {

    }
    if (method === 'pp') return ppValid(s.ppId) ? '<button class="btn gold big block" data-x="pay">ได้รับเงินแล้ว ' + B(t.total) + '</button>' : '';

    sheet.setBody('<div class="pay-total"><span>ยอดที่ต้องชำระ' + (cart.label ? ' · ' + esc(cart.label) : '') + '</span><strong>' + B(t.total) + '</strong></div>' +
      '<div class="seg full" role="tablist"><button data-m="cash" class="' + (method === 'cash' ? 'on' : '') + '">เงินสด</button><button data-m="pp" class="' + (method === 'pp' ? 'on' : '') + '">พร้อมเพย์</button><button data-m="other" class="' + (method === 'other' ? 'on' : '') + '">โอน / บัตร / อื่นๆ</button></div>' +

    if (x.dataset.x === 'pay') finish();
  });
}
async function completeSale(pay) {
  const now = Date.now(); const day = dayKey(now);
  if (state.seq.day !== day) state.seq = {day, n: 0};
  state.seq.n += 1;
  const bill = makeBill(cart, now, pad(state.seq.n, 4), pay, false);
  state.bills.push(bill);
  const lowNow = [];
  bill.items.forEach(i => { const p = prod(i.pid); if (p && p.track) { p.stock = (p.stock || 0) - i.qty; if (p.stock <= p.low) lowNow.push(p); } });
  cart = emptyCart(); saveCart();
  openCartMobile(false); renderSell();
  showSuccess(bill);
  await saveConfig(); await saveDay(day);
  const uniq = Array.from(new Set(lowNow)); if (uniq.length) setTimeout(() => toast('ใกล้หมด: ' + uniq.map(p => p.name + ' (เหลือ ' + Math.max(0, p.stock) + ')').join(', '), 4000), 900);

async function slipPNG(lines, voidText) {
  try { await Promise.all([document.fonts.load('400 22px Anuphan'), document.fonts.load('700 22px Anuphan')]); } catch (e) {}

    if (line.trim() || !out.length) out.push(line.trim()); return out;
  };
  const ops = [];
  const text = (t, o) => { const z = o.size || 22, font = F(o.w || 400, z), ind = o.indent || 0; wrap(t, font, W - 2 * P - ind).forEach(l => ops.push({h: Math.round(z * 1.5), f: c => { c.font = font; c.fillStyle = o.color || '#111'; c.textAlign = o.align || 'left'; c.fillText(l, o.align === 'center' ? W / 2 : P + ind, Math.round(z * .75)); }})); };
  const pair = (l, r, o) => { const z = o.size || 22, font = F(o.w || 400, z); m.font = font; const rw = r ? m.measureText(r).width : 0; const ls = wrap(l, font, W - 2 * P - rw - 20); ls.forEach((t, i) => ops.push({h: Math.round(z * 1.5), f: c => { c.font = font; c.fillStyle = o.color || '#111'; c.textAlign = 'left'; c.fillText(t, P, Math.round(z * .75)); if (i === 0 && r) { c.textAlign = 'right'; c.fillText(r, W - P, Math.round(z * .75)); } }})); };
  lines.forEach(L => {
    if (L.k === 'h') text(L.t, {w: 700, size: 30, align: 'center'});
    else if (L.k === 'c') text(L.t, {w: L.bold ? 600 : 400, size: L.small ? 19 : 22, align: 'center', color: L.small ? '#444' : '#111'});
    else if (L.k === 't') text(L.t, {w: L.bold ? 600 : 400, size: 18, color: '#555', indent: 18});
    else if (L.k === 'p') pair(L.l, L.r || '', {w: L.big || L.bold ? 700 : 400, size: L.big ? 28 : L.small ? 19 : 22, color: L.small ? '#333' : '#111'});
    else if (L.k === 's') ops.push({h: 22, f: c => { c.strokeStyle = '#888'; c.lineWidth = 2; c.setLineDash([8, 6]); c.beginPath(); c.moveTo(P, 11); c.lineTo(W - P, 11); c.stroke(); c.setLineDash([]); }});
    else if (L.k === 'g') ops.push({h: Math.round((L.h || 6) * 1.6), f: () => {}});
  });
  if (voidText) { ops.push({h: 10, f: () => {}}); text(voidText, {w: 700, size: 24, align: 'center', color: '#C0352E'}); }
  const H = ops.reduce((a, o) => a + o.h, 0) + 2 * P;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, W, H); c.textBaseline = 'middle';

}

function openPinPad(mode, done) {
  let pin = '', first = '', msg = '', step = mode === 'set' ? 'new' : 'check', finished = false;
  const titles = {check: 'ใส่รหัสเจ้าของร้าน', new: 'ตั้งรหัสเจ้าของร้าน 4 หลัก', again: 'ใส่รหัสใหม่อีกครั้ง'};
  let sheet;
  const draw = () => {
    sheet.setBody('<div class="pin"><p class="pin-title">' + titles[step] + '</p><div class="pin-dots' + (msg ? ' bad' : '') + '">' + [0, 1, 2, 3].map(i => '<i class="' + (i < pin.length ? 'on' : '') + '"></i>').join('') + '</div><p class="pin-msg">' + esc(msg) + '</p>' +
      '<div class="keypad pinpad">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(k => k ? '<button data-pk="' + k + '"' + (k === '⌫' ? ' aria-label="ลบ"' : '') + '>' + k + '</button>' : '<span></span>').join('') + '</div>' +
      (step === 'check' ? '<button class="btn ghost sm" data-x="forgot" style="align-self:center">ลืมรหัส?</button>' : '') + '</div>');
  };
  const press = async k => {
    if (k === '⌫') { pin = pin.slice(0, -1); draw(); return; }
    if (pin.length >= 4) return;
    pin += k; msg = ''; draw();
    if (pin.length < 4) return;
    if (step === 'check') {
      const h = await hashPin(pin, state.settings.pinSalt);
      if (h === state.settings.pinHash) { lock.unlocked = true; lock.at = Date.now(); finished = true; sheet.close(); done && done(true); }
      else { msg = 'รหัสไม่ถูกต้อง ลองใหม่'; pin = ''; draw(); }
    } else if (step === 'new') { first = pin; pin = ''; step = 'again'; draw(); }
    else {
      if (pin !== first) { msg = 'รหัสสองครั้งไม่ตรงกัน เริ่มใหม่'; pin = ''; first = ''; step = 'new'; draw(); return; }
      state.settings.pinSalt = rid(10); state.settings.pinHash = await hashPin(pin, state.settings.pinSalt);
      lock.unlocked = true; lock.at = Date.now(); await saveConfig(); finished = true; sheet.close(); done && done(true);
    }
  };

    onKey: e => { if (/^[0-9]$/.test(e.key)) { press(e.key); return true; } if (e.key === 'Backspace') { press('⌫'); return true; } return false; }});

    const k = e.target.closest('[data-pk]'); if (k) { press(k.dataset.pk); return; }

  });
}

async function fileToThumb(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const W = 360, H = 240, r = W / H, iw = im.naturalWidth, ih = im.naturalHeight;
    let sw = iw, sh = iw / r; if (sh > ih) { sh = ih; sw = ih * r; }
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    c.getContext('2d').drawImage(im, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, W, H);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}

    (pinOn() ? '<div class="row wrap"><button class="btn" data-act="pin-set">เปลี่ยนรหัส</button><button class="btn danger" data-act="pin-off">ปิดการใช้รหัส</button></div><label class="switch"><span>ให้พนักงานใส่ส่วนลดได้เอง</span><input type="checkbox" id="staff-disc"' + (s.staffDiscount !== false ? ' checked' : '') + '></label>' : '<button class="btn primary" data-act="pin-set">ตั้งรหัสเจ้าของร้าน</button>') + '</div>';
  const nameField = st.kind === 'licensed' ? '<label class="field"><span>ชื่อร้าน</span><input class="inp" value="' + esc(s.shopName) + '" readonly><small>ชื่อร้านผูกกับรหัสเปิดใช้งาน ถ้าต้องการเปลี่ยนให้ติดต่อผู้ขาย</small></label>' : f('shopName', 'ชื่อร้าน', 'ชื่อร้านของคุณ');
  $('#shop').innerHTML = '<div class="page-head"><h1>ตั้งค่าร้าน</h1>' + lockBtn() + '</div><div class="settings">' + licCard +
    '<div class="card"><h2>ข้อมูลร้าน (แสดงบนใบเสร็จ)</h2>' + nameField + f('address', 'ที่อยู่', 'ไม่บังคับ') + '<div class="grid2">' + f('phone', 'เบอร์โทร', '0x-xxx-xxxx', ' inputmode="tel"') + f('taxId', 'เลขผู้เสียภาษี', 'ไม่บังคับ', ' inputmode="numeric"') + '</div>' +
    '<label class="field"><span>ข้อความท้ายใบเสร็จ</span><input class="inp" data-set="footer" value="' + esc(s.footer) + '" autocomplete="off"></label>' +
    '<div class="field"><span>ขนาดกระดาษเครื่องพิมพ์ใบเสร็จ</span><div class="seg full"><button data-act="paper" data-v="58" class="' + (s.paper === '58' ? 'on' : '') + '">58 มม.</button><button data-act="paper" data-v="80" class="' + (s.paper === '80' ? 'on' : '') + '">80 มม.</button></div></div></div>' +
    '<div class="card"><h2>รับเงิน</h2>' +
    '<label class="field"><span>เบอร์พร้อมเพย์ของร้าน</span><input class="inp num" data-set="ppId" value="' + esc(s.ppId) + '" placeholder="เบอร์มือถือ หรือเลข 13 หลัก" inputmode="numeric" autocomplete="off"><small id="pp-hint">' + (s.ppId ? (ppValid(s.ppId) ? 'ใช้ได้ ระบบจะสร้าง QR ตามยอดบิลให้อัตโนมัติ' : 'เบอร์ไม่ถูกต้อง ใส่เบอร์มือถือ 10 หลัก หรือเลข 13 หลัก') : 'ใส่แล้วตอนคิดเงินจะมี QR ให้ลูกค้าสแกน') + '</small></label>' +
    f('ppName', 'ชื่อบัญชีที่แสดงใต้ QR', 'เช่น นายสมชาย ใจดี') +
    '<label class="field"><span>เงินทอนตั้งต้นในลิ้นชัก (บาท)</span><input class="inp num" data-set="startFloat" data-money="1" value="' + satToStr(s.startFloat) + '" inputmode="decimal" autocomplete="off"></label>' +
    '<div class="field"><span>ภาษีมูลค่าเพิ่ม (VAT)</span><div class="seg full"><button data-act="vat" data-v="none" class="' + (s.vatMode === 'none' ? 'on' : '') + '">ไม่มี VAT</button><button data-act="vat" data-v="incl" class="' + (s.vatMode === 'incl' ? 'on' : '') + '">รวมในราคาแล้ว</button><button data-act="vat" data-v="excl" class="' + (s.vatMode === 'excl' ? 'on' : '') + '">บวกเพิ่ม 7%</button></div><small>ร้านที่จด VAT ต้องขออนุมัติใช้เครื่อง POS กับกรมสรรพากรก่อน จึงจะออกใบกำกับภาษีอย่างย่อได้</small></div></div>' +
    pinCard + '<div class="card"><h2>ข้อมูลและการสำรอง</h2><div class="note-box" id="store-status">' + storageText() + '</div>' +
    '<div class="row wrap"><button class="btn" data-act="backup">' + ICON.dl + 'สำรองข้อมูล (.json)</button><button class="btn" data-act="restore">กู้คืนจากไฟล์</button></div>' +
    (state.demo ? '<button class="btn gold" data-act="go-live">ล้างข้อมูลตัวอย่าง แล้วเริ่มใช้งานจริง</button>' : '') +
    '<button class="btn danger" data-act="wipe">ลบข้อมูลทั้งหมด</button></div>' +
    '<div class="card"><h2>เกี่ยวกับแอป</h2><p style="margin:0" class="muted">ขายคล่อง POS เวอร์ชัน ' + VERSION + ' · ใช้ได้ทั้งมือถือ แท็บเล็ต และคอม · ใช้งานได้แม้เน็ตหลุด · รองรับเครื่องสแกนบาร์โค้ดแบบ USB/บลูทูธ (สแกนที่หน้าขายได้เลย) · พิมพ์ใบเสร็จผ่านเครื่องพิมพ์ความร้อน 58/80 มม.</p></div>' +
    '</div>';
}
let setTimer = 0;
function onSettingInput(el) {
  const k = el.dataset.set; const s = state.settings;
  s[k] = el.dataset.money ? toSat(el.value) : el.value.trim();
  if (k === 'ppId') { s.ppId = el.value.replace(/\D/g, ''); const h = $('#pp-hint'); if (h) h.textContent = !s.ppId ? 'ใส่แล้วตอนคิดเงินจะมี QR ให้ลูกค้าสแกน' : ppValid(s.ppId) ? 'ใช้ได้ ระบบจะสร้าง QR ตามยอดบิลให้อัตโนมัติ' : 'เบอร์ไม่ถูกต้อง ใส่เบอร์มือถือ 10 หลัก หรือเลข 13 หลัก'; }
  clearTimeout(setTimer); setTimer = setTimeout(() => saveConfig(), 600);
}
function backupJSON() {
  const data = JSON.stringify({app: 'khaiklong-pos', version: 2, exportedAt: new Date().toISOString(), config: configDoc(), bills: state.bills, expenses: state.expenses, images: state.images, parked: state.parked});
  saveFile('ขายคล่อง-สำรอง-' + dayKey(Date.now()) + '.json', data);
}
async function restoreJSON(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast('อ่านไฟล์ไม่ได้ ต้องเป็นไฟล์สำรองของขายคล่อง (.json)'); return; }
  if (!d || d.app !== 'khaiklong-pos' || !d.config) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของขายคล่อง'); return; }
  if (!await confirmBox('กู้คืนข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ (' + (d.bills || []).length + ' บิล, ' + ((d.config.products || []).length) + ' สินค้า)', 'กู้คืน', true)) return;
  applyConfig(d.config); state.updatedAt = Date.now();
  state.bills = (d.bills || []).map(b => Object.assign(b, {wdev: DEV, updatedAt: Math.max(b.updatedAt || 0, 1)}));
  state.expenses = (d.expenses || []).map(b => Object.assign(b, {wdev: DEV, updatedAt: Math.max(b.updatedAt || 0, 1)}));
  state.images = d.images && typeof d.images === 'object' ? d.images : {};
  if (lic.payload) state.settings.shopName = lic.payload.n;
  state.parked = d.parked || []; state.parkedAt = Date.now(); sortBills();
  await saveEverythingLocal();
  if (Cloud.db) { await Cloud.wipe(); pushAll(); }
  renderAll(); toast('กู้คืนข้อมูลเรียบร้อย');
}
function goLive() {
  openSheet({title: 'เริ่มใช้งานจริง', html: '<p style="margin:0">ล้างบิลตัวอย่างทั้งหมดออก แล้วเลือกว่าจะเก็บเมนูตัวอย่างไว้แก้ต่อ หรือเริ่มจากเมนูว่าง</p>',
    foot: '<button class="btn" data-x="keep">เก็บเมนูไว้แก้ต่อ</button><button class="btn gold" data-x="zero">เริ่มจากศูนย์</button>', mount: api => {
      api.foot.addEventListener('click', async e => {
        const x = e.target.closest('[data-x]'); if (!x) return;
        const keepMenu = x.dataset.x === 'keep';
        state.bills = []; state.expenses = []; state.parked = []; state.seq = {day: '', n: 0}; state.demo = false; cart = emptyCart(); saveCart();
        const keepSettings = Object.assign(defaultSettings(), {ppId: state.settings.ppId, paper: state.settings.paper, pinHash: state.settings.pinHash, pinSalt: state.settings.pinSalt});
        if (lic.payload) keepSettings.shopName = lic.payload.n;
        state.settings = keepSettings;
        if (!keepMenu) { state.products = []; state.categories = []; state.optionGroups = []; state.images = {}; }
        else state.products.forEach(p => { p.track = false; p.soldOut = false; });
        state.updatedAt = Date.now();
        await saveEverythingLocal();
        if (Cloud.db) { await Cloud.wipe(); pushAll(); }
        api.close(); location.hash = keepMenu ? '#items' : '#shop'; renderAll();
        toast(keepMenu ? 'พร้อมแล้ว แก้ชื่อร้านที่หน้าตั้งค่า และแก้ราคาเมนูได้ที่นี่' : 'พร้อมแล้ว เริ่มจากใส่ชื่อร้าน แล้วเพิ่มสินค้า', 4500);
      });
    }});
}
async function wipeAll() {
  if (!await confirmBox('ลบข้อมูลทั้งหมด ทั้งสินค้า บิล และการตั้งค่า? ย้อนกลับไม่ได้ ควรกดสำรองข้อมูลก่อน', 'ลบทั้งหมด', true)) return;
  state = freshState(); state.parkedAt = Date.now(); state.updatedAt = Date.now();
  if (lic.payload) state.settings.shopName = lic.payload.n;
  lock.unlocked = false;
  cart = emptyCart(); saveCart();
  await saveEverythingLocal();
  if (Cloud.db) { await Cloud.wipe(); pushAll(); }
  renderAll(); toast('ลบข้อมูลแล้ว');
}

/* ===================== actions & events ===================== */
const ACT = {
  'sheet-close': el => { const s = sheetOf(el); if (s) s.close(); },
  cat: el => { ui.cat = el.dataset.id; renderCats(); renderGrid(); },
  add: el => tapProduct(el.dataset.id),
  qty: (el, e) => { e.stopPropagation(); const i = cart.items[+el.dataset.i]; if (!i) return; i.qty += +el.dataset.d; if (i.qty <= 0) cart.items.splice(+el.dataset.i, 1); cartChanged(); },
  'line-edit': el => editLine(+el.dataset.i),
  otype: el => { cart.orderType = el.dataset.v; saveCart(); renderCart(); },
  discount: () => { if (state.settings.staffDiscount === false) requireOwner(openDiscount); else openDiscount(); },
  'cart-clear': async () => { if (await confirmBox('ล้างรายการในบิลนี้ทั้งหมด?', 'ล้างบิล', true)) { cart = emptyCart(); cartChanged(); } },
  'cart-open': () => openCartMobile(true),
  'cart-close': () => openCartMobile(false),
  park: () => parkCart(),
  'parked-list': () => openParked(),
  pay: () => openPay(),
  print: el => { const b = state.bills.find(x => x.id === el.dataset.id); if (b) printBill(b); },
  img: el => { const b = state.bills.find(x => x.id === el.dataset.id); if (b) saveReceiptImage(b); },
  'bill-open': el => openBill(el.dataset.id),
  void: el => { const id = el.dataset.id; requireOwner(() => voidFlow(id)); },
  bday: el => { const d = +el.dataset.d; const today = dayKey(Date.now()); ui.bday = d === 0 ? today : dayKey(addDays(keyToTs(ui.bday), d)); if (ui.bday > today) ui.bday = today; renderBills(); },
  range: el => { ui.range = el.dataset.r; renderReport(); },
  csv: () => exportCSV(),
  itab: el => { ui.itemsTab = el.dataset.t; renderItems(); },
  'prod-new': () => requireOwner(() => openProduct(null)),
  'prod-edit': el => openProduct(el.dataset.id),
  'cat-add': async () => { const inp = $('#cat-new'); const n = inp.value.trim(); if (!n) { inp.focus(); return; } state.categories.push({id: uid('k'), name: n}); await saveConfig(); renderItems(); toast('เพิ่มหมวด "' + n + '" แล้ว'); setTimeout(() => { const i = $('#cat-new'); if (i) i.focus(); }, 30); },
  'cat-move': async el => { const i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= state.categories.length) return; const a = state.categories; [a[i], a[j]] = [a[j], a[i]]; await saveConfig(); renderItems(); },
  'cat-rename': el => { const c = cat(el.dataset.id); if (!c) return; openSheet({title: 'แก้ชื่อหมวด', html: '<input class="inp" id="cat-name" value="' + esc(c.name) + '" autofocus autocomplete="off" aria-label="ชื่อหมวด">', foot: '<button class="btn primary block" data-x="ok">บันทึก</button>', mount: api => { const go = async () => { const v = $('#cat-name', api.el).value.trim(); if (!v) return; c.name = v; await saveConfig(); api.close(); renderItems(); }; api.foot.addEventListener('click', go); api.el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); }}); },
  'cat-del': async el => { const c = cat(el.dataset.id); if (!c) return; const n = state.products.filter(p => p.catId === c.id).length; if (await confirmBox('ลบหมวด "' + esc(c.name) + '"?' + (n ? ' สินค้า ' + n + ' รายการในหมวดนี้จะย้ายไปอยู่ "ไม่มีหมวด"' : ''), 'ลบหมวด', true)) { state.categories = state.categories.filter(x => x.id !== c.id); state.products.forEach(p => { if (p.catId === c.id) p.catId = ''; }); await saveConfig(); renderItems(); } },
  'og-new': () => openOptionGroup(null),
  'og-edit': el => openOptionGroup(el.dataset.id),
  paper: el => { state.settings.paper = el.dataset.v; saveConfig(); renderShop(); },
  vat: el => { state.settings.vatMode = el.dataset.v; saveConfig(); renderShop(); renderCart(); },
  backup: () => backupJSON(),
  restore: () => $('#file-in').click(),
  'go-live': () => goLive(),
  wipe: () => wipeAll(),
  activate: () => openActivate(),
  unlock: () => openPinPad('check', ok => { if (ok) renderView(); }),
  'lock-now': () => { lock.unlocked = false; renderView(); toast('ล็อกแล้ว'); },
  'pin-set': () => openPinPad('set', ok => { if (ok) { renderShop(); toast('ตั้งรหัสเจ้าของร้านแล้ว อย่าลืมรหัสนะครับ', 3500); } }),
  'pin-off': async () => { if (await confirmBox('ปิดการใช้รหัสเจ้าของร้าน? ทุกคนจะเข้าได้ทุกหน้า', 'ปิดรหัส', true)) { state.settings.pinHash = ''; state.settings.pinSalt = ''; await saveConfig(); renderShop(); } },
  'close-slip': () => openCloseSlip(),
  'exp-add': el => openExpense(el.dataset.day),
  'exp-del': el => deleteExpense(el.dataset.id)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value; renderGrid(); }
  else if (t.id === 'bq') { ui.bq = t.value; renderBills(); }
  else if (t.id === 'iq') { ui.itemsQ = t.value; const pos = t.selectionStart; renderItems(); const n = $('#iq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } }
  else if (t.id === 'cart-label') { cart.label = t.value; saveCart(); }
  else if (t.dataset.set) onSettingInput(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'bdate' && t.value) { const k = t.value.replace(/-/g, ''); ui.bday = k > dayKey(Date.now()) ? dayKey(Date.now()) : k; renderBills(); }
  else if (t.id === 'file-in' && t.files && t.files[0]) { restoreJSON(t.files[0]); t.value = ''; }
  else if (t.id === 'staff-disc') { state.settings.staffDiscount = t.checked; saveConfig(); }
});
// keyboard: sheets, line rows, barcode scanner
let scanBuf = '', scanAt = 0;
document.addEventListener('keydown', e => {
  const s = topSheet();
  if (s) {
    if (e.key === 'Escape') { s.close(); return; }
    const inInput = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');
    if (s.onKey && !inInput && s.onKey(e)) e.preventDefault();
    return;
  }
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains('line') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); editLine(+a.dataset.i); return; }
  if (ui.view !== 'sell') return;
  if (a && a.id === 'q' && e.key === 'Enter') {
    const v = a.value.trim(); if (!v) return;
    const exact = state.products.find(p => p.barcode && p.barcode === v); const list = filteredProducts();
    const p = exact || (list.length === 1 ? list[0] : null);
    if (p) { tapProduct(p.id); a.value = ''; ui.q = ''; renderGrid(); }
    return;
  }
  if (/INPUT|TEXTAREA|SELECT/.test((a || {}).tagName || '')) return;
  const now = performance.now();
  if (e.key === 'Enter') { if (scanBuf.length >= 4) { const p = state.products.find(x => x.barcode === scanBuf); if (p) tapProduct(p.id); else toast('ไม่พบสินค้าบาร์โค้ด ' + scanBuf); } scanBuf = ''; return; }
  if (e.key.length === 1) { if (now - scanAt > 80) scanBuf = ''; scanBuf += e.key; scanAt = now; }
});
window.addEventListener('hashchange', route);
document.addEventListener('pointerdown', () => { if (lock.unlocked) lock.at = Date.now(); }, true);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { lock.hiddenAt = Date.now(); return; }
  if (lock.unlocked && lock.hiddenAt && Date.now() - lock.hiddenAt > 2 * 60e3) { lock.unlocked = false; if (OWNER_VIEWS[ui.view]) renderView(); }
  if (ui.view === 'sell') renderBanners();
});
matchMedia('(min-width:900px)').addEventListener('change', () => openCartMobile(false));

/* ===================== boot ===================== */
async function boot() {
  await loadLocal();
  setCloud('off');
  route();
  if (EDITION === 'shop') {
    try {
      const u = new URL(location.href); const k = u.searchParams.get('key');
      if (k) { u.searchParams.delete('key'); history.replaceState(null, '', u.pathname + u.search + u.hash); await activate(k); }
    } catch (e) {}
  }
  if (CL) connectCloud();
  if (CL) dlCap = CL.use('downloads');
  if (!inFrame && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }
}
boot();
})();
